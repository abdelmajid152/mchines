<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A4A24">
<title>آلياتك — نموذج تجريبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#0A4A24; --primary:#067A37; --bright:#0AA84F; --tint:#E3F3E8; --tint2:#EEF4F0;
  --ink:#141A16; --muted:#4A554D; --line:#E3E7E4; --amber-bg:#FFF1CC; --amber:#6B4A00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans Arabic",sans-serif;color:var(--ink);background:#E9EFEB;display:flex;align-items:center;justify-content:center}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
a{color:var(--primary)}
.phone{width:390px;height:844px;background:#fff;border-radius:44px;position:relative;overflow:hidden;box-shadow:0 0 0 10px #141A16,0 30px 70px rgba(0,0,0,.3)}
@media (max-width:500px){
  body{display:block;background:#fff}
  .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
}
.side-note{position:fixed;top:24px;right:24px;max-width:260px;font-size:14px;line-height:1.6;color:var(--muted)}
.side-note b{color:var(--dark);font-size:18px;display:block;margin-bottom:4px}
@media (max-width:900px){.side-note{display:none}}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:120px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.nopad{padding-bottom:110px}
/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;gap:10px}
.hdr h1{margin:0;font-size:21px;font-weight:800}
.circle-back{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;padding:0}
.icon-btn{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--primary);padding:0;position:relative}
.badge{position:absolute;top:4px;left:3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--primary);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.support-mini{width:44px;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--ink);border:none;background:none;padding:0}
/* common */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:22px 20px 10px}
.sec-h h2{margin:0;font-size:18px;font-weight:800}
.sec-h button{border:none;background:none;color:var(--primary);font-size:15px;font-weight:700;padding:0}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.chip.cn{background:var(--amber-bg);color:var(--amber)}
.chip.sd{background:var(--tint);color:#0A5A2C}
.btn{height:56px;border-radius:16px;border:none;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.dark{background:var(--dark);color:#fff}
.btn.green{background:var(--primary);color:#fff}
.btn.outline{background:#fff;border:1.5px solid var(--dark);color:var(--dark);font-size:16px;font-weight:700;height:50px}
.field{display:block;position:relative;margin:0 20px}
.field>span{position:absolute;top:-11px;right:14px;padding:0 6px;background:#fff;font-size:14px;font-weight:500}
.field input,.field textarea{width:100%;border:1.5px solid var(--ink);border-radius:14px;font-size:16px;padding:16px;outline:none;background:#fff}
.field textarea{height:100px;resize:none}
.field input:focus,.field textarea:focus{border-color:var(--primary)}
.seg{margin:0 20px;padding:6px;border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{height:48px;border-radius:10px;border:none;background:transparent;color:var(--primary);font-size:17px;font-weight:700}
.seg button.on{background:var(--bright);color:#fff}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--bright);background:#fff;color:var(--primary);font-size:15px;font-weight:700}
.pill.on{background:var(--bright);color:#fff}
.ph{background:var(--tint2);display:flex;align-items:center;justify-content:center;color:#8FB39C}
/* product cards */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
.pcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;text-align:right;padding:0;color:var(--ink)}
.pcard .ph{height:118px}
.pcard .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pcard .n{font-size:15px;font-weight:700;line-height:1.35}
.price{font-size:16px;font-weight:800;color:var(--primary)}
/* categories */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;padding:0 14px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;border:none;background:none;padding:0;color:var(--ink);font-size:14px;font-weight:500}
.cat i{width:62px;height:62px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--primary)}
/* nav */
.navwrap{position:absolute;left:12px;right:12px;bottom:14px;height:72px;z-index:20}
.navwrap svg.shape{position:absolute;left:0;top:0;width:100%;height:72px;filter:drop-shadow(0 8px 18px rgba(10,74,36,.16))}
.navwrap nav{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-bottom:8px}
.navwrap nav button{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;color:#5B655E;font-size:12px;font-weight:500;padding:0}
.navwrap nav button i{width:52px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.navwrap nav button.on{color:var(--primary);font-weight:700}
.navwrap nav button.on i{background:var(--tint)}
.navwrap .mid{text-align:center;font-size:12px;font-weight:700;color:var(--primary)}
.fab{position:absolute;left:50%;margin-left:-32px;top:-30px;width:64px;height:64px;border-radius:50%;border:none;background:var(--bright);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px rgba(10,168,79,.12),0 8px 20px rgba(10,168,79,.4);padding:0}
.navwrap.dark svg.shape{filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
.navwrap.dark nav button{color:#B9C4BC}
.navwrap.dark .mid{color:#3DD07F;font-weight:800}
.navwrap.dark .fab{box-shadow:0 0 0 4px rgba(61,208,127,.3),0 0 26px rgba(10,168,79,.6)}
/* reels */
.reels{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;background:#18211B;scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{height:100%;scroll-snap-align:start;position:relative;color:#fff;overflow:hidden}
.reel .vid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.reel .vid svg{animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-2deg)}}
.reel .shade{position:absolute;left:0;right:0;bottom:0;height:440px;background:linear-gradient(to top,rgba(10,16,12,.92),rgba(10,16,12,0))}
.reel .prog{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.25)}
.reel .prog div{height:3px;background:var(--bright);animation:prog 9s linear infinite}
@keyframes prog{from{width:0}to{width:100%}}
.reel-top{position:absolute;top:16px;left:0;right:0;padding:0 16px;display:flex;gap:8px;align-items:center;z-index:5}
.rchip{height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.55);background:rgba(0,0,0,.25);color:#fff;font-size:15px;font-weight:500}
.rchip.on{background:#fff;color:var(--dark);border-color:#fff;font-weight:800}
.ract{position:absolute;left:12px;bottom:300px;display:flex;flex-direction:column;gap:18px;align-items:center}
.ract button{border:none;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:0}
.ract button i{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.ract button.liked i{background:#D93A2B}
.rcap{position:absolute;right:16px;left:80px;bottom:232px}
.rcard{position:absolute;right:16px;left:16px;bottom:124px;background:#fff;border-radius:18px;padding:10px;display:flex;align-items:center;gap:10px;color:var(--ink)}
/* misc */
.toast{position:absolute;left:20px;right:20px;top:20px;background:var(--dark);color:#fff;padding:14px 16px;border-radius:14px;font-weight:700;font-size:15px;z-index:50;display:flex;gap:10px;align-items:center;transform:translateY(-250%);transition:transform .3s}
.toast.show{transform:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:10px 20px 30px}
.grab{width:44px;height:5px;border-radius:3px;background:#D5DED8;margin:0 auto 14px}
.row-line{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.row-line span:first-child{color:var(--muted)}
.row-line span:last-child{font-weight:700}
.list-item{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid #E8ECE9;border-left:none;border-right:none;border-top:none;background:none;width:100%;text-align:right;color:var(--ink);font-size:18px}
.list-item i{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0}
.qty{display:flex;align-items:center;border:1px solid #D5DED8;border-radius:999px}
.qty button{width:34px;height:34px;border:none;background:none;color:var(--primary);font-size:20px;font-weight:700;padding:0}
.qty span{min-width:22px;text-align:center;font-size:15px;font-weight:800}
.step{display:flex;gap:14px}
.step .rail{display:flex;flex-direction:column;align-items:center;width:30px}
.step .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.step .ln{width:3px;height:26px}
.empty{padding:50px 30px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="side-note"><b>آلياتك — نموذج تجريبي</b>هذا نموذج أولي للتصميم. الأسعار والمنتجات بيانات افتراضية للعرض فقط. جرّب الريلز، والبحث (اكتب «بلوك» مثلاً)، وقائمة عرض السعر.</div>
<div class="phone" id="phone">
  <div id="app"></div>
  <div class="toast" id="toast"></div>
</div>

  <button data-act="pick" style="height:104px;border-radius:14px;border:1.5px dashed var(--primary);background:#F3F9F5;color:var(--primary);font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px">${ic('cameraPlus',28,2)}إضافة</button></div>
 <p style="margin:8px 0 0;padding:0 20px;font-size:13px;color:var(--muted)">حتى ٥ صور وفيديو واحد مدته دقيقة كحد أقصى</p>
 <button data-act="rec" style="margin:16px 20px 0;width:calc(100% - 40px);padding:12px 14px;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:12px;background:#fff;text-align:right;color:var(--ink)"><span style="width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0">${ic('mic',22,2.2)}</span><span><span style="display:block;font-size:16px;font-weight:700">سجّل رسالة صوتية</span><span style="font-size:13px;color:var(--muted)">اشرح طلبك بصوتك بدل الكتابة</span></span></button>
 <div style="padding-top:24px"><label class="field"><span>وصف الآلة المطلوبة</span><textarea placeholder="مثلاً: أريد آلة لصناعة الطحنية بإنتاج ١٠٠ كجم في اليوم…"></textarea></label></div>
 <div style="padding:22px 20px 0"><div style="font-size:15px;font-weight:700;margin-bottom:8px">الكهرباء المتاحة عندك</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${['220 فولت','380 فولت','مولد / ديزل'].map(v=>`<button class="pill ${S.volt===v.split(' ')[0]?'on':''}" data-volt="${v.split(' ')[0]}" style="padding:0">${v}</button>`).join('')}</div></div>
 <div style="padding-top:24px"><label class="field"><span>الميزانية التقريبية (اختياري)</span><input inputmode="numeric" placeholder="بالدولار"></label></div>
 <div style="padding:22px 20px 0"><button class="btn dark" data-act="sendcustom">إرسال للدعم الفني</button></div>
</div>`;

V.quote=()=>{const ids=Object.keys(S.quote).map(Number);const total=ids.reduce((a,id)=>a+byId(id).price*S.quote[id],0);
 return `<div class="screen" style="padding-bottom:180px"><div class="hdr">${backBtn()}<h1>قائمة عرض السعر</h1><span style="width:44px;height:30px;border-radius:15px;background:var(--tint);color:#0A5A2C;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center">${qCount()}</span></div>
 <div style="margin:0 20px;padding:12px 14px;border-radius:14px;background:#F3F9F5;display:flex;gap:10px;font-size:14px;line-height:1.6;color:#2F3A33">${ic('truck',22,2,'style="color:var(--primary);flex-shrink:0"')}<span>أضف كل الآلات التي تحتاجها، ونرسل لك <b>عرض سعر واحد بشحن مجمّع</b>، وهو أوفر من طلب كل آلة وحدها.</span></div>
 <div style="padding:16px 20px 0;display:flex;flex-direction:column;gap:12px">
 ${ids.length?ids.map(id=>{const p=byId(id);return `<div style="display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px">
  <button data-pid="${p.id}" class="ph" style="width:76px;height:76px;border-radius:12px;border:none;flex-shrink:0">${ic(p.icon,38,1.3)}</button>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start">
   <div style="display:flex;justify-content:space-between;gap:8px;width:100%"><span style="font-size:15px;font-weight:700;line-height:1.35">${p.name}</span><button data-rm="${p.id}" aria-label="حذف" style="width:32px;height:32px;border:none;background:none;color:#8A948D;padding:0;flex-shrink:0">${ic('trash',18,2)}</button></div>
   ${chip(p)}
   <div style="display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:4px"><span class="price">${usd(p.price)}</span><div class="qty"><button data-inc="${p.id}" aria-label="زيادة">+</button><span>${S.quote[id]}</span><button data-dec="${p.id}" aria-label="تقليل">−</button></div></div></div></div>`}).join('')
  :`<div class="empty">قائمتك فارغة.<br>أضف الآلات من صفحات المنتجات.</div>`}
  <button data-act="all" style="height:46px;border-radius:14px;border:1.5px dashed var(--primary);background:#fff;color:var(--primary);font-size:15px;font-weight:700">+ أضف آلة أخرى</button></div>
 <div style="padding-top:22px"><label class="field"><span>ملاحظات لفريق المبيعات (اختياري)</span><textarea style="height:80px" placeholder="مثلاً: نريدها خط إنتاج واحد لتعبئة الزيت…"></textarea></label></div>
</div>
<div style="position:absolute;left:0;right:0;bottom:0;padding:14px 20px 22px;background:#fff;border-top:1px solid var(--line);z-index:5">
 <div style="display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px"><span style="color:var(--muted)">إجمالي الآلات (${qCount()} قطع)</span><b>${usd(total)}</b></div>
 <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:12px"><span style="color:var(--muted)">الشحن المجمّع والجمارك</span><b style="color:var(--primary)">يُحسب في العرض</b></div>
 <button class="btn dark" data-act="sendquote" ${ids.length?'':'disabled style="opacity:.5"'}>اطلب عرض السعر</button></div>`;};

V.orders=()=>{const steps=[['تأكيد الطلب','٢ نوفمبر',2],['دفع العربون','تم استلام إشعار التحويل',2],['الشراء من المورد في الصين','',2],['في الشحن البحري','غادرت الشحنة ميناء الصين',1],['الوصول إلى بورتسودان','',0],['التخليص الجمركي','',0],['التسليم','',0]];
 return `<div class="screen"><div class="hdr"><span style="width:44px"></span><h1>طلباتي</h1>${supportMini()}</div>
 <div class="seg"><button data-ot="orders" class="${S.ordersTab==='orders'?'on':''}">الطلبات</button><button data-ot="inq" class="${S.ordersTab==='inq'?'on':''}">الاستفسارات (${S.inquiries.length})</button></div>
 ${S.ordersTab==='inq'?`<div style="padding:18px 20px 0">${inqList()}</div>`:`
 <div style="margin:18px 20px 0;padding:16px;border-radius:18px;background:#0E7A3A;color:#fff;display:flex;gap:12px;align-items:center"><span style="width:64px;height:64px;border-radius:14px;background:#3D9862;display:flex;align-items:center;justify-content:center;color:#D3EADB;flex-shrink:0">${ic('machine',34,1.4)}</span><span><b style="display:block;font-size:16px">ماكينة تعبئة سوائل نصف أوتوماتيك</b><span style="font-size:14px;color:#D3EADB">طلب رقم #1024 · الكمية ١</span><b style="display:block;font-size:14px">الوصول المتوقع: ١٥ ديسمبر</b></span></div>
 <div style="padding:22px 20px 0"><h2 style="margin:0 0 14px;font-size:17px;font-weight:800">حالة الطلب</h2>
 ${steps.map((s,i)=>`<div class="step"><div class="rail"><span class="dot" style="${s[2]===2?'background:var(--primary);color:#fff':s[2]===1?'border:3px solid var(--primary)':'border:2px solid #C9D3CC'}">${s[2]===2?ic('check',16,3):s[2]===1?'<span style="width:10px;height:10px;border-radius:50%;background:var(--primary)"></span>':''}</span>${i<steps.length-1?`<span class="ln" style="background:${s[2]===2?'var(--primary)':'#D5DED8'}"></span>`:''}</div><div style="padding-top:4px"><div style="font-size:16px;font-weight:${s[2]===1?800:s[2]?700:500};color:${s[2]===1?'var(--primary)':s[2]?'var(--ink)':'var(--muted)'}">${s[0]}</div>${s[1]?`<div style="font-size:13px;color:var(--muted)">${s[1]}</div>`:''}</div></div>`).join('')}</div>
 <div style="padding:22px 20px 0"><button class="btn outline" data-act="wa">${ic('chat',20,2)}محادثة الدعم</button></div>`}
</div>${nav('orders')}`;};

V.menu=()=>`<div class="screen">
 <div style="background:var(--dark);color:#fff;padding:22px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px">
  <div><div style="font-size:22px;font-weight:700">أهلاً بك، عبدالمجيد</div><span style="display:inline-flex;margin-top:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:#fff;color:var(--dark);align-items:center;gap:6px">${ic('building',14,2.2)}حساب شركة · موثّق</span></div>
  <button data-go="home" aria-label="إغلاق" style="width:46px;height:46px;border-radius:50%;background:#fff;border:none;display:flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0">${ic('x',22,2.6)}</button></div>
 <div style="padding:0 20px">
 ${[['user','بيانات الحساب والشركة'],['box','طلباتي وعروض الأسعار','orders'],['clip','قائمة عرض السعر','quote'],['heart','المفضلة'],['pin','عناوين التوصيل'],['bell','الإشعارات'],['video','فيديوهات إرشادية'],['help','المساعدة والدعم الفني']].map(r=>`<button class="list-item" ${r[2]?`data-go="${r[2]}"`:'data-act="soon"'}><i>${ic(r[0],26,1.8)}</i>${r[1]}</button>`).join('')}
 <button class="list-item" data-act="share"><i style="background:var(--bright);color:#fff;border:none">${ic('share',24,2)}</i>ادعُ أصدقاءك</button>
 <button class="list-item" data-act="soon" style="color:#B42318;font-weight:700;border-bottom:none"><i style="color:#B42318;border-color:#F2D4D0">${ic('logout',24,2)}</i>تسجيل الخروج</button></div>
 <div style="text-align:center;font-size:13px;color:#6B746E;padding-top:10px">الإصدار 1.0.0 · نموذج تجريبي</div>
</div>${nav('menu')}`;

/* ---------- render & events ---------- */
function render(){
  let s=cur(); if(s==='list'&&!S.cat&&S.q&&!P.some(p=>p.name.includes(S.q.trim())||CATS.find(c=>c.id===p.cat).name.includes(S.q.trim()))) s='empty';
  document.getElementById('app').innerHTML=(V[s]||V.home)();
  const sc=document.querySelector('.screen'); if(sc) sc.scrollTop=0;
}
document.getElementById('app').addEventListener('click',e=>{
  const t=e.target.closest('button,[data-go]'); if(!t) return;
  const d=t.dataset;
  if(d.go){ if(d.go==='reels'&&cur()==='reels'){document.getElementById('reels').scrollTo({top:0,behavior:'smooth'});return;} return go(d.go); }
  if(d.pid){ S.pid=+d.pid; if(d.buy) return orderNow(); return go('product'); }
  if(d.cat){ return go('list',{cat:d.cat,q:''}); }
  if(d.ft){ S.findTab=d.ft; return render(); }
  if(d.ot){ S.ordersTab=d.ot; return render(); }
  if(d.volt){ S.volt=d.volt; return render(); }
  if(d.inc){ S.quote[d.inc]++; return render(); }
  if(d.dec){ if(--S.quote[d.dec]<=0) delete S.quote[d.dec]; return render(); }
  if(d.rm){ delete S.quote[d.rm]; return render(); }
  switch(d.act){
    case 'back': return back();
    case 'all': return go('list',{cat:null,q:''});
    case 'like': { const id=+(d.id||S.pid); S.liked[id]=!S.liked[id]; toast(S.liked[id]?'تمت الإضافة للمفضلة':'أُزيلت من المفضلة'); if(cur()==='reels'){t.classList.toggle('liked',S.liked[id]); t.querySelector('svg').setAttribute('fill',S.liked[id]?'currentColor':'none'); return;} return render(); }
    case 'share': return toast('تم نسخ رابط المشاركة');
    case 'wa': return toast('سيفتح واتساب للتواصل مع الدعم');
    case 'notif': return toast('لا توجد إشعارات جديدة');
    case 'mute': S.muted=!S.muted; t.innerHTML=ic(S.muted?'mute':'sound',20,2); return;
    case 'pick': return toast('سيفتح معرض الصور في التطبيق الحقيقي');
    case 'rec': return toast('سيبدأ التسجيل الصوتي في التطبيق الحقيقي');
    case 'soon': return toast('هذه الشاشة ضمن المرحلة القادمة');
    case 'addq': { if(S.quote[S.pid]) return go('quote'); S.quote[S.pid]=1; toast('أُضيفت لقائمة عرض السعر'); return render(); }
    case 'order': return orderNow();
    case 'sendfind': S.inquiries.unshift({name:'منتج من رابط خارجي',when:'الآن',status:'قيد المراجعة',ok:false}); toast('تم إرسال طلبك، سيرد عليك الدعم قريباً'); S.ordersTab='inq'; return go('orders');
    case 'sendcustom': S.inquiries.unshift({name:'طلب آلة خاصة',when:'الآن',status:'قيد المراجعة',ok:false}); toast('تم إرسال طلبك للدعم الفني'); S.ordersTab='inq'; return go('orders');
    case 'sendquote': S.quote={}; toast('تم إرسال طلب عرض السعر'); S.ordersTab='orders'; return go('orders');
  }
});
document.getElementById('app').addEventListener('submit',e=>{e.preventDefault(); const q=new FormData(e.target).get('q').trim(); if(!q) return; go('list',{q,cat:null});});
function orderNow(){ const p=byId(S.pid);
  const el=document.createElement('div'); el.className='sheet-bg';
  el.innerHTML=`<div class="sheet"><div class="grab"></div><h2 style="margin:0 0 4px;font-size:20px;font-weight:800">تأكيد الطلب</h2><p style="margin:0 0 14px;color:var(--muted);font-size:15px">${p.name}</p>
   <div class="row-line"><span>سعر الآلة</span><span>${usd(p.price)}</span></div><div class="row-line"><span>الشحن والجمارك (تقديري)</span><span>${p.ship?usd(p.ship):'مشمول'}</span></div>
   <div class="row-line" style="border:none"><span>${p.src==='cn'?'العربون المطلوب الآن (٣٠٪)':'المبلغ المطلوب'}</span><span style="color:var(--primary);font-size:18px">${usd(Math.round((p.price+p.ship)*(p.src==='cn'?.3:1)))}</span></div>
   <p style="font-size:13px;color:var(--muted);margin:4px 0 16px">بعد التأكيد تظهر لك بيانات التحويل البنكي لرفع إيصال الدفع.</p>
   <button class="btn dark" id="cf">تأكيد الطلب</button><button class="btn" id="cc" style="background:none;color:var(--muted);font-size:16px;height:48px;margin-top:6px">إلغاء</button></div>`;
  document.getElementById('phone').appendChild(el);
  el.addEventListener('click',ev=>{ if(ev.target===el||ev.target.id==='cc') el.remove(); if(ev.target.id==='cf'){ el.remove(); toast('تم تأكيد طلبك'); S.ordersTab='orders'; go('orders'); }});
}
render();
</script>
</body>
</html>
