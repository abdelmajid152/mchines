<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A4A24">
<title>آلياتك — نموذج تجريبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#0A4A24; --primary:#067A37; --bright:#0AA84F; --tint:#E3F3E8; --tint2:#EEF4F0;
  --ink:#141A16; --muted:#4A554D; --line:#E3E7E4; --amber-bg:#FFF1CC; --amber:#6B4A00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans Arabic",sans-serif;color:var(--ink);background:#E9EFEB;display:flex;align-items:center;justify-content:center}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
a{color:var(--primary)}
.phone{width:390px;height:844px;background:#fff;border-radius:44px;position:relative;overflow:hidden;box-shadow:0 0 0 10px #141A16,0 30px 70px rgba(0,0,0,.3)}
@media (max-width:500px){
  body{display:block;background:#fff}
  .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
}
.side-note{position:fixed;top:24px;right:24px;max-width:260px;font-size:14px;line-height:1.6;color:var(--muted)}
.side-note b{color:var(--dark);font-size:18px;display:block;margin-bottom:4px}
@media (max-width:900px){.side-note{display:none}}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:120px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.nopad{padding-bottom:110px}
/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;gap:10px}
.hdr h1{margin:0;font-size:21px;font-weight:800}
.circle-back{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;padding:0}
.icon-btn{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--primary);padding:0;position:relative}
.badge{position:absolute;top:4px;left:3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--primary);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.support-mini{width:44px;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--ink);border:none;background:none;padding:0}
/* common */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:22px 20px 10px}
.sec-h h2{margin:0;font-size:18px;font-weight:800}
.sec-h button{border:none;background:none;color:var(--primary);font-size:15px;font-weight:700;padding:0}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.chip.cn{background:var(--amber-bg);color:var(--amber)}
.chip.sd{background:var(--tint);color:#0A5A2C}
.btn{height:56px;border-radius:16px;border:none;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.dark{background:var(--dark);color:#fff}
.btn.green{background:var(--primary);color:#fff}
.btn.outline{background:#fff;border:1.5px solid var(--dark);color:var(--dark);font-size:16px;font-weight:700;height:50px}
.field{display:block;position:relative;margin:0 20px}
.field>span{position:absolute;top:-11px;right:14px;padding:0 6px;background:#fff;font-size:14px;font-weight:500}
.field input,.field textarea{width:100%;border:1.5px solid var(--ink);border-radius:14px;font-size:16px;padding:16px;outline:none;background:#fff}
.field textarea{height:100px;resize:none}
.field input:focus,.field textarea:focus{border-color:var(--primary)}
.seg{margin:0 20px;padding:6px;border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{height:48px;border-radius:10px;border:none;background:transparent;color:var(--primary);font-size:17px;font-weight:700}
.seg button.on{background:var(--bright);color:#fff}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--bright);background:#fff;color:var(--primary);font-size:15px;font-weight:700}
.pill.on{background:var(--bright);color:#fff}
.ph{background:var(--tint2);display:flex;align-items:center;justify-content:center;color:#8FB39C}
/* product cards */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
.pcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;text-align:right;padding:0;color:var(--ink)}
.pcard .ph{height:118px}
.pcard .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pcard .n{font-size:15px;font-weight:700;line-height:1.35}
.price{font-size:16px;font-weight:800;color:var(--primary)}
/* categories */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;padding:0 14px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;border:none;background:none;padding:0;color:var(--ink);font-size:14px;font-weight:500}
.cat i{width:62px;height:62px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--primary)}
/* nav */
.navwrap{position:absolute;left:12px;right:12px;bottom:14px;height:72px;z-index:20}
.navwrap svg.shape{position:absolute;left:0;top:0;width:100%;height:72px;filter:drop-shadow(0 8px 18px rgba(10,74,36,.16))}
.navwrap nav{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-bottom:8px}
.navwrap nav button{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;color:#5B655E;font-size:12px;font-weight:500;padding:0}
.navwrap nav button i{width:52px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.navwrap nav button.on{color:var(--primary);font-weight:700}
.navwrap nav button.on i{background:var(--tint)}
.navwrap .mid{text-align:center;font-size:12px;font-weight:700;color:var(--primary)}
.fab{position:absolute;left:50%;margin-left:-32px;top:-30px;width:64px;height:64px;border-radius:50%;border:none;background:var(--bright);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px rgba(10,168,79,.12),0 8px 20px rgba(10,168,79,.4);padding:0}
.navwrap.dark svg.shape{filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
.navwrap.dark nav button{color:#B9C4BC}
.navwrap.dark .mid{color:#3DD07F;font-weight:800}
.navwrap.dark .fab{box-shadow:0 0 0 4px rgba(61,208,127,.3),0 0 26px rgba(10,168,79,.6)}
/* reels */
.reels{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;background:#18211B;scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{height:100%;scroll-snap-align:start;position:relative;color:#fff;overflow:hidden}
.reel .vid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.reel .vid svg{animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-2deg)}}
.reel .shade{position:absolute;left:0;right:0;bottom:0;height:440px;background:linear-gradient(to top,rgba(10,16,12,.92),rgba(10,16,12,0))}
.reel .prog{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.25)}
.reel .prog div{height:3px;background:var(--bright);animation:prog 9s linear infinite}
@keyframes prog{from{width:0}to{width:100%}}
.reel-top{position:absolute;top:16px;left:0;right:0;padding:0 16px;display:flex;gap:8px;align-items:center;z-index:5}
.rchip{height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.55);background:rgba(0,0,0,.25);color:#fff;font-size:15px;font-weight:500}
.rchip.on{background:#fff;color:var(--dark);border-color:#fff;font-weight:800}
.ract{position:absolute;left:12px;bottom:300px;display:flex;flex-direction:column;gap:18px;align-items:center}
.ract button{border:none;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:0}
.ract button i{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.ract button.liked i{background:#D93A2B}
.rcap{position:absolute;right:16px;left:80px;bottom:232px}
.rcard{position:absolute;right:16px;left:16px;bottom:124px;background:#fff;border-radius:18px;padding:10px;display:flex;align-items:center;gap:10px;color:var(--ink)}
/* misc */
.toast{position:absolute;left:20px;right:20px;top:20px;background:var(--dark);color:#fff;padding:14px 16px;border-radius:14px;font-weight:700;font-size:15px;z-index:50;display:flex;gap:10px;align-items:center;transform:translateY(-250%);transition:transform .3s}
.toast.show{transform:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:10px 20px 30px}
.grab{width:44px;height:5px;border-radius:3px;background:#D5DED8;margin:0 auto 14px}
.row-line{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.row-line span:first-child{color:var(--muted)}
.row-line span:last-child{font-weight:700}
.list-item{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid #E8ECE9;border-left:none;border-right:none;border-top:none;background:none;width:100%;text-align:right;color:var(--ink);font-size:18px}
.list-item i{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0}
.qty{display:flex;align-items:center;border:1px solid #D5DED8;border-radius:999px}
.qty button{width:34px;height:34px;border:none;background:none;color:var(--primary);font-size:20px;font-weight:700;padding:0}
.qty span{min-width:22px;text-align:center;font-size:15px;font-weight:800}
.step{display:flex;gap:14px}
.step .rail{display:flex;flex-direction:column;align-items:center;width:30px}
.step .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.step .ln{width:3px;height:26px}
.empty{padding:50px 30px;text-align:center;color:var(--muted)}
/* auth */
.dots{display:flex;gap:14px;justify-content:center;direction:ltr;margin:18px 0 6px}
.dots span{width:16px;height:16px;border-radius:50%;border:2px solid #9AA59E;transition:all .15s}
.dots span.f{background:var(--primary);border-color:var(--primary);transform:scale(1.1)}
.dots.err span{border-color:#D93A2B}
.dots.err{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px;padding:10px 40px 0;direction:ltr}
.keypad button{height:62px;border-radius:50%;border:none;background:transparent;font-size:28px;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:center}
.keypad button:active{background:var(--tint2)}
.keypad .ghost{visibility:hidden}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:10px}
.phone-in{display:flex;align-items:center;border:1.5px solid var(--ink);border-radius:14px;height:60px;direction:ltr;overflow:hidden}
.phone-in b{padding:0 14px;font-size:17px;color:var(--dark);border-right:1px solid var(--line);height:100%;display:flex;align-items:center;background:var(--tint2)}
.phone-in input{flex:1;min-width:0;border:none;outline:none;font-size:19px;font-weight:600;padding:0 14px;letter-spacing:1px;background:transparent}
.phone-in:focus-within{border-color:var(--primary)}
</style>
</head>
<body>
<div class="side-note"><b>آلياتك — نموذج تجريبي</b>هذا نموذج أولي للتصميم. الأسعار والمنتجات بيانات افتراضية للعرض فقط. جرّب الريلز، والبحث (اكتب «بلوك» مثلاً)، وقائمة عرض السعر.<br><br><b style="font-size:15px">التسجيل</b>تصفّح كزائر، وعند أول طلب سيُطلب منك التسجيل: أي رقم سوداني، ثم رمز سري من ٦ أرقام. بعد تسجيل الخروج يظهر لك الدخول بالرمز أو البصمة.</div>
<div class="phone" id="phone">
  <div id="app"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
const I = {

  finger:'<path d="M6.5 8.5a6 6 0 0 1 11 3.3V13"/><path d="M4.5 14.5V12a7.5 7.5 0 0 1 1-3.7"/><path d="M9 20.5c1-1.8 1.5-4 1.5-6.5v-2a1.5 1.5 0 0 1 3 0v1.5"/><path d="M13.5 17c-.2 1.3-.6 2.6-1.2 3.7"/><path d="M7.5 18.5c.6-1.4 1-3 1-4.5V12a3.5 3.5 0 0 1 7 0v2.5c0 1.3-.1 2.6-.4 3.8"/><path d="M17.5 16.5c.2-.9.3-1.8.3-2.7"/>',

const ic=(n,s=24,w=1.9,extra='')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${I[n]}</svg>`;
const play=(s=30)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 6.2v11.6l9.2-5.8z"/></svg>`;

const CATS=[
  {id:'agri',name:'زراعية'},{id:'build',name:'بناء'},{id:'food',name:'تصنيع غذائي'},{id:'pack',name:'تعبئة وتغليف'},
  {id:'gen',name:'مولدات'},{id:'wood',name:'ورش ونجارة'},{id:'print',name:'طباعة'}];
const P=[
  {id:1,name:'ماكينة تعبئة سوائل نصف أوتوماتيك',cat:'pack',price:1250,ship:380,src:'cn',days:'٣٠–٤٥',icon:'machine',reel:'شاهد ماكينة التعبئة وهي تعبّئ زيت الطعام',
   specs:[['عدد الرؤوس','رأس واحد'],['القدرة الإنتاجية','٢٠ عبوة / دقيقة'],['حجم التعبئة','٥٠–٥٠٠ مل'],['الكهرباء','220 فولت'],['الوزن','٤٥ كجم'],['الضمان','٦ أشهر']],

const fmtPhone=p=>'+249 '+p.slice(0,2)+' '+p.slice(2,5)+' '+p.slice(5);
const weakPin=p=>/^(\d)\1{5}$/.test(p)||'0123456789'.includes(p)||'9876543210'.includes(p);
const logo=()=>`<div class="auth-logo"><div style="width:52px;height:52px;border-radius:16px;background:var(--dark);display:flex;align-items:center;justify-content:center;color:#fff">${ic('gen',30,1.9)}</div><div style="line-height:1.1"><div style="font-size:26px;font-weight:800;color:var(--dark)">آلياتك</div><div style="font-size:12px;font-weight:500;color:#5B655E;letter-spacing:1px">MACHINES · SUDAN</div></div></div>`;
function needAuth(after){ if(S.user) return false; Object.assign(A,{after,pin:'',err:'',confirm:false,tries:0,step:S.known?'login':'phone',phone:S.known?S.known.phone:''}); go('auth'); return true; }
function finishAuth(){ const cb=A.after; A.after=null; S.stack=S.stack.filter(s=>s!=='auth'); if(!S.stack.length) S.stack=['home']; render(); if(cb) setTimeout(cb,150); }
const keypad=(bio)=>`<div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-key="${n}">${n}</button>`).join('')}
 ${bio?`<button data-key="bio" aria-label="الدخول بالبصمة" style="color:var(--primary)">${ic('finger',32,1.8)}</button>`:'<button class="ghost" tabindex="-1" aria-hidden="true"></button>'}<button data-key="0">0</button><button data-key="del" aria-label="حذف" style="color:var(--muted)">${ic('del',28,1.8)}</button></div>`;
const dots=()=>`<div class="dots ${A.err?'err':''}" aria-label="${A.pin.length} من ٦ أرقام">${[0,1,2,3,4,5].map(i=>`<span class="${i<A.pin.length?'f':''}"></span>`).join('')}</div><div style="min-height:24px;text-align:center;font-size:14px;font-weight:700;color:#B42318">${A.err}</div>`;
V.auth=()=>{ const st=A.step;
 const top=`<div class="hdr">${st==='login'?`<button class="circle-back" data-act="authClose" aria-label="إغلاق">${ic('x',18,2.6)}</button>`:backBtn()}<span></span><span style="width:44px"></span></div>`;
 if(st==='phone') return `<div class="screen nopad">${top}<div style="padding:10px 20px 0">${logo()}
  <h1 style="margin:34px 0 6px;font-size:23px;font-weight:800">سجّل الدخول أو أنشئ حساباً</h1>
  <p style="margin:0 0 26px;font-size:15px;line-height:1.6;color:var(--muted)">أدخل رقم هاتفك. لن نرسل لك رسالة، فقط تأكد أن الرقم صحيح لأن فريقنا سيتواصل معك عليه.</p>
  <form data-form="phone"><label style="display:block"><span style="display:block;font-size:14px;font-weight:600;margin-bottom:8px">رقم الهاتف</span>
  <span class="phone-in"><b>+249</b><input name="phone" inputmode="tel" autocomplete="tel" placeholder="9X XXX XXXX" value="${A.phone}" aria-label="رقم الهاتف"></span></label>
  <div style="min-height:24px;font-size:14px;font-weight:700;color:#B42318;margin-top:6px">${A.err}</div>
  <button class="btn dark" style="margin-top:6px">متابعة</button></form>
  <p style="text-align:center;font-size:13px;color:var(--muted);margin-top:18px">بالمتابعة أنت توافق على الشروط وسياسة الخصوصية</p></div>
  ${A.confirm?`<div class="sheet-bg" style="position:absolute"><div class="sheet"><div class="grab"></div>
   <div style="width:64px;height:64px;border-radius:50%;background:var(--tint);color:var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto 12px">${ic('info',32,2)}</div>
   <h2 style="margin:0;text-align:center;font-size:20px;font-weight:800">هل هذا رقمك؟</h2>
   <div style="text-align:center;direction:ltr;font-size:26px;font-weight:700;color:var(--dark);margin:12px 0 6px;letter-spacing:1px">${fmtPhone(A.phone)}</div>
   <p style="text-align:center;margin:0 0 18px;font-size:14px;color:var(--muted)">سنتواصل معك على هذا الرقم بخصوص طلباتك، عبر الاتصال أو واتساب.</p>
   <button class="btn dark" data-act="phoneYes">نعم، هذا رقمي</button><button class="btn" data-act="phoneEdit" style="background:none;color:var(--primary);font-size:16px;height:50px;margin-top:4px">تعديل الرقم</button></div></div>`:''}</div>`;
 if(st==='login') return `<div class="screen nopad">${top}<div style="text-align:center;padding:0 20px">${logo()}
  <div style="margin-top:26px;font-size:22px;font-weight:800;color:var(--primary)">أهلاً بك</div><div style="font-size:19px;font-weight:600">${S.known.name}</div>
  <div style="direction:ltr;font-size:14px;color:var(--muted);margin-top:2px">${fmtPhone(S.known.phone)}</div>
  <div style="margin-top:22px;font-size:16px;font-weight:600">${A.tries>=5?'تم إيقاف الدخول مؤقتاً':'أدخل رمزك السري'}</div>${dots()}</div>
  ${A.tries>=5?`<div style="margin:10px 20px;padding:14px;border-radius:14px;background:#FDECEA;color:#8A1F14;font-size:14px;line-height:1.6;text-align:center">${ic('lock',22,2)}<br>أدخلت رمزاً خاطئاً ٥ مرات. حاول بعد ١٥ دقيقة، أو تواصل مع الدعم لإعادة تعيين الرمز.</div>`:keypad(S.bio)}
  <div style="display:flex;justify-content:space-between;padding:14px 28px 0"><button data-act="forgot" style="border:none;background:none;color:var(--primary);font-size:15px;font-weight:700">نسيت الرمز؟</button><button data-act="otherNum" style="border:none;background:none;color:var(--muted);font-size:15px;font-weight:600">ليس أنت؟</button></div></div>`;
 if(st==='create'||st==='repeat') return `<div class="screen nopad">${top}<div style="text-align:center;padding:10px 20px 0">
  <div style="width:72px;height:72px;border-radius:50%;background:var(--tint);color:var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto">${ic('lock',36,1.9)}</div>
  <h1 style="margin:18px 0 6px;font-size:22px;font-weight:800">${st==='create'?'أنشئ رمزك السري':'أعد كتابة الرمز للتأكيد'}</h1>
  <p style="margin:0;font-size:15px;color:var(--muted)">${st==='create'?'٦ أرقام تستخدمها للدخول إلى حسابك':'اكتب نفس الرمز مرة أخرى'}</p>${dots()}
  <div style="display:flex;gap:6px;justify-content:center;margin-bottom:6px">${[1,2,3].map(i=>`<span style="width:${(st==='create'?1:2)>=i?24:8}px;height:6px;border-radius:3px;background:${(st==='create'?1:2)>=i?'var(--primary)':'#D5DED8'}"></span>`).join('')}</div></div>${keypad(false)}</div>`;
 if(st==='profile') return `<div class="screen nopad">${top}<div style="padding:0 20px">
  <div style="display:flex;gap:6px;justify-content:center;margin-bottom:16px">${[1,2,3].map(()=>`<span style="width:24px;height:6px;border-radius:3px;background:var(--primary)"></span>`).join('')}</div>
  <h1 style="margin:0 0 6px;font-size:22px;font-weight:800">أكمل بياناتك</h1><p style="margin:0 0 22px;font-size:15px;color:var(--muted)">خطوة أخيرة وحسابك جاهز.</p></div>
  <form data-form="profile">
  <div class="seg" style="margin-bottom:26px"><button type="button" data-acct="ind" class="${A.type==='ind'?'on':''}">فرد</button><button type="button" data-acct="co" class="${A.type==='co'?'on':''}">شركة / مصنع</button></div>
  <label class="field"><span>${A.type==='co'?'اسم المسؤول':'الاسم الكامل'}</span><input name="name" required placeholder="مثلاً: عبدالمجيد يحيى"></label>
  ${A.type==='co'?`<label class="field" style="margin-top:24px"><span>اسم الشركة</span><input name="company" required placeholder="مثلاً: مصنع النيل للزيوت"></label>`:''}
  <label class="field" style="margin-top:24px"><span>المدينة</span><input name="city" placeholder="مثلاً: بورتسودان"></label>
  <div style="padding:26px 20px 0"><button class="btn dark">إنشاء الحساب</button></div></form></div>`;
 if(st==='bio') return `<div class="screen nopad"><div style="text-align:center;padding:90px 28px 0">
  <div style="width:130px;height:130px;border-radius:50%;background:var(--tint);color:var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto">${ic('finger',72,1.5)}</div>
  <h1 style="margin:24px 0 8px;font-size:23px;font-weight:800">ادخل بلمسة واحدة</h1>
  <p style="margin:0 0 30px;font-size:15px;line-height:1.7;color:var(--muted)">فعّل الدخول بالبصمة أو الوجه، فلا تحتاج لكتابة الرمز السري عند الدخول مرة أخرى.</p>
  <button class="btn dark" data-act="bioYes">تفعيل البصمة</button><button class="btn" data-act="bioNo" style="background:none;color:var(--muted);font-size:16px;height:50px;margin-top:4px">لاحقاً</button></div></div>`;
};
function pinKey(k){
  if(A.tries>=5) return;
  if(k==='bio'){ toast('تم التحقق بالبصمة'); return loginOK(); }
  if(k==='del'){ A.pin=A.pin.slice(0,-1); A.err=''; return render(true); }
  if(A.pin.length>=6) return;
  A.pin+=k; A.err=''; render(true);
  if(A.pin.length<6) return;
  setTimeout(()=>{
    if(A.step==='create'){ if(weakPin(A.pin)){A.err='رمز سهل التخمين، اختر رمزاً آخر';A.pin='';return render(true);} A.pin1=A.pin; A.pin=''; A.step='repeat'; return render(); }
    if(A.step==='repeat'){ if(A.pin!==A.pin1){A.err='الرمزان غير متطابقين، ابدأ من جديد';A.pin='';A.step='create';return render(true);} A.pin=''; A.step='profile'; return render(); }
    if(A.step==='login'){ if(A.pin===S.known.pin) return loginOK(); A.tries++; A.pin=''; A.err=A.tries>=5?'':`رمز خاطئ، تبقّت ${5-A.tries} محاولات`; return render(true); }
  },160);
}
function loginOK(){ S.user={...S.known}; toast(`أهلاً بعودتك، ${S.user.name.split(' ')[0]}`); finishAuth(); }

/* ---------- render & events ---------- */
function render(keep=false){
  let s=cur(); if(s==='list'&&!S.cat&&S.q&&!P.some(p=>p.name.includes(S.q.trim())||CATS.find(c=>c.id===p.cat).name.includes(S.q.trim()))) s='empty';
  const old=document.querySelector('#app .screen'); const top=keep&&old?old.scrollTop:0;
  document.getElementById('app').innerHTML=(V[s]||V.home)();
  const sc=document.querySelector('#app .screen'); if(sc) sc.scrollTop=top;
}
document.getElementById('app').addEventListener('click',e=>{
  const t=e.target.closest('button,[data-go]'); if(!t) return;
  const d=t.dataset;
  if(d.go){ if(d.go==='reels'&&cur()==='reels'){document.getElementById('reels').scrollTo({top:0,behavior:'smooth'});return;} return go(d.go); }
  if(d.key){ return pinKey(d.key); }
  if(d.acct){ A.type=d.acct; return render(true); }
  if(d.vpid){ S.vsel[d.vpid]=+d.vi; return render(true); }
  if(d.pid){ S.pid=+d.pid; if(d.pvi!==undefined) S.vsel[S.pid]=+d.pvi; if(d.buy) return orderNow(); return go('product'); }
  if(d.cat){ return go('list',{cat:d.cat,q:''}); }
  if(d.ft){ S.findTab=d.ft; return render(); }
  if(d.ot){ S.ordersTab=d.ot; return render(); }
  if(d.volt){ S.volt=d.volt; return render(); }
  if(d.inc){ S.quote[d.inc]++; return render(true); }
  if(d.dec){ if(--S.quote[d.dec]<=0) delete S.quote[d.dec]; return render(true); }
  if(d.rm){ delete S.quote[d.rm]; return render(true); }
  switch(d.act){
    case 'back': return back();
    case 'all': return go('list',{cat:null,q:''});
    case 'like': { const id=+(d.id||S.pid); S.liked[id]=!S.liked[id]; toast(S.liked[id]?'تمت الإضافة للمفضلة':'أُزيلت من المفضلة'); if(cur()==='reels'){t.classList.toggle('liked',S.liked[id]); t.querySelector('svg').setAttribute('fill',S.liked[id]?'currentColor':'none'); return;} return render(); }
    case 'share': return toast('تم نسخ رابط المشاركة');
    case 'wa': return toast('سيفتح واتساب للتواصل مع الدعم');
    case 'notif': return toast('لا توجد إشعارات جديدة');
    case 'mute': S.muted=!S.muted; t.innerHTML=ic(S.muted?'mute':'sound',20,2); return;
    case 'pick': return toast('سيفتح معرض الصور في التطبيق الحقيقي');
    case 'rec': return toast('سيبدأ التسجيل الصوتي في التطبيق الحقيقي');
    case 'soon': return toast('هذه الشاشة ضمن المرحلة القادمة');
    case 'addq': { const p=byId(S.pid); const k=qKey(S.pid,vIdx(p)); if(S.quote[k]) return go('quote'); S.quote[k]=1; toast(p.vars?`أُضيف خيار ${pv(p).label} لقائمة عرض السعر`:'أُضيفت لقائمة عرض السعر'); return render(true); }
    case 'order': return orderNow();
    case 'login': return needAuth(null);
    case 'authClose': A.after=null; S.stack=S.stack.filter(s=>s!=='auth'); if(!S.stack.length) S.stack=['home']; return render();
    case 'phoneYes': A.confirm=false; A.step='create'; A.pin=''; A.err=''; return render();
    case 'phoneEdit': A.confirm=false; return render();
    case 'otherNum': S.known=null; Object.assign(A,{step:'phone',phone:'',pin:'',err:'',tries:0}); return render();
    case 'forgot': return forgotSheet();
    case 'bioYes': S.bio=true; toast('تم تفعيل الدخول بالبصمة'); return finishAuth();
    case 'bioNo': return finishAuth();
    case 'bioToggle': S.bio=!S.bio; toast(S.bio?'تم تفعيل الدخول بالبصمة':'تم إيقاف الدخول بالبصمة'); return render(true);
    case 'logout': S.user=null; S.stack=['home']; toast('تم تسجيل الخروج'); return render();
    case 'sendfind': if(needAuth(null)) return; S.inquiries.unshift({name:'منتج من رابط خارجي',when:'الآن',status:'قيد المراجعة',ok:false}); toast('تم إرسال طلبك، سيرد عليك الدعم قريباً'); S.ordersTab='inq'; return go('orders');
    case 'sendcustom': if(needAuth(null)) return; S.inquiries.unshift({name:'طلب آلة خاصة',when:'الآن',status:'قيد المراجعة',ok:false}); toast('تم إرسال طلبك للدعم الفني'); S.ordersTab='inq'; return go('orders');
    case 'sendquote': if(needAuth(()=>toast('تم تسجيل دخولك، اضغط «اطلب عرض السعر» للإرسال'))) return; S.quote={}; toast('تم إرسال طلب عرض السعر'); S.ordersTab='orders'; return go('orders');
  }
});
document.getElementById('app').addEventListener('submit',e=>{e.preventDefault(); const f=new FormData(e.target); const kind=e.target.dataset.form;
  if(kind==='phone'){ let ph=toLatin(String(f.get('phone'))).replace(/\D/g,''); if(ph.startsWith('249')) ph=ph.slice(3); if(ph.startsWith('0')) ph=ph.slice(1);
    A.phone=ph; if(!/^[19]\d{8}$/.test(ph)){A.err='رقم غير صحيح، اكتب ٩ أرقام يبدأ بـ 9 أو 1';return render(true);} A.err='';
    if(S.known&&S.known.phone===ph){A.step='login';A.pin='';return render();} A.confirm=true; return render(true); }
  if(kind==='profile'){ const name=String(f.get('name')).trim(); if(!name) return;
    S.known={phone:A.phone,pin:A.pin1,name,type:A.type,company:String(f.get('company')||'').trim(),city:String(f.get('city')||'').trim()};
    S.user={...S.known}; toast('تم إنشاء حسابك بنجاح'); A.step='bio'; return render(); }
  const q=String(f.get('q')||'').trim(); if(!q) return; go('list',{q,cat:null});});
function forgotSheet(){ const el=document.createElement('div'); el.className='sheet-bg';
  el.innerHTML=`<div class="sheet"><div class="grab"></div><h2 style="margin:0 0 8px;font-size:20px;font-weight:800">نسيت الرمز السري؟</h2>
   <p style="margin:0 0 18px;font-size:15px;line-height:1.7;color:var(--muted)">تواصل مع فريق الدعم عبر واتساب من نفس الرقم المسجل. بعد التحقق من هويتك، نعيد تعيين الرمز وتنشئ رمزاً جديداً.</p>
   <button class="btn" id="fw" style="background:var(--bright);color:#fff">${ic('wa',22,2)}تواصل عبر واتساب</button><button class="btn" id="fc" style="background:none;color:var(--muted);font-size:16px;height:48px;margin-top:6px">إلغاء</button></div>`;
  document.getElementById('phone').appendChild(el);
  el.addEventListener('click',ev=>{ if(ev.target===el||ev.target.id==='fc') el.remove(); if(ev.target.closest('#fw')){ el.remove(); toast('سيفتح واتساب للتواصل مع الدعم'); }});
}
function orderNow(){ if(needAuth(()=>orderNow())) return; const p=byId(S.pid);
  const el=document.createElement('div'); el.className='sheet-bg';
  const paint=()=>{ const d=pv(p);
   el.innerHTML=`<div class="sheet"><div class="grab"></div><h2 style="margin:0 0 4px;font-size:20px;font-weight:800">تأكيد الطلب</h2><p style="margin:0 0 ${p.vars?4:14}px;color:var(--muted);font-size:15px">${p.name}</p>
   ${p.vars?`<div style="margin-bottom:10px">${varPicker(p,true)}</div>`:''}
   ${d.src==='cn'?`<div style="font-size:13px;font-weight:700;color:var(--amber);margin:6px 0">● يُطلب من الصين · يصل خلال ${d.days} يوماً</div>`:`<div style="font-size:13px;font-weight:700;color:#0A5A2C;margin:6px 0">● متوفر في السودان · تسليم خلال أيام</div>`}
   <div class="row-line"><span>سعر الآلة</span><span>${usd(d.price)}</span></div><div class="row-line"><span>الشحن والجمارك (تقديري)</span><span>${d.ship?usd(d.ship):'مشمول'}</span></div>
   <div class="row-line" style="border:none"><span>${d.src==='cn'?'العربون المطلوب الآن (٣٠٪)':'المبلغ المطلوب'}</span><span style="color:var(--primary);font-size:18px">${usd(Math.round((d.price+d.ship)*(d.src==='cn'?.3:1)))}</span></div>
   <p style="font-size:13px;color:var(--muted);margin:4px 0 16px">بعد التأكيد تظهر لك بيانات التحويل البنكي لرفع إيصال الدفع.</p>
   <button class="btn dark" id="cf">تأكيد الطلب</button><button class="btn" id="cc" style="background:none;color:var(--muted);font-size:16px;height:48px;margin-top:6px">إلغاء</button></div>`; };
  paint();
  document.getElementById('phone').appendChild(el);
  el.addEventListener('click',ev=>{
    const vb=ev.target.closest('[data-vpid]'); if(vb){ S.vsel[p.id]=+vb.dataset.vi; paint(); if(cur()==='product') render(true); return; }
    if(ev.target===el||ev.target.id==='cc') el.remove();
    if(ev.target.id==='cf'){ el.remove(); toast('تم تأكيد طلبك'); S.ordersTab='orders'; go('orders'); }});
}
render();
</script>
</body>
</html>
